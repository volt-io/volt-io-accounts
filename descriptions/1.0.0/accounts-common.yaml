openapi: 3.0.1
info:
  title: Global Api Accounts
  version: 1.0.0
  description: Common model definitions
components:
  schemas:
    Amount:
      type: integer
      format: int64
      minimum: 1
      description: The total value of the transaction represented in minor units (e.g. 100 for 1.00 EUR). Must be a positive integer.
      example: 123
    AccountIdentifier:
      description: A container for a single account identifier. Exactly one of the listed structures must be provided.
      anyOf:
        - $ref: '#/components/schemas/IbanSwiftIdentifier'
        - $ref: '#/components/schemas/AccountNumberSortCodeIdentifier'
        - $ref: '#/components/schemas/BsbIdentifier'
        - $ref: '#/components/schemas/PayIdIdentifier'
    IbanSwiftIdentifier:
      type: object
      properties:
        iban:
          type: string
          example: PL61109010140000071219812874
        swiftBic:
          type: string
          description: valid BIC
          example: WBKPPLPP
    AccountNumberSortCodeIdentifier:
      type: object
      properties:
        accountNumber:
          type: string
          example: '12345678'
        sortCode:
          type: string
          example: 11-22-33
    BsbIdentifier:
      type: object
      properties:
        accountNumber:
          type: string
          example: '12345678'
        bsb:
          type: string
          example: '062000'
    PayIdIdentifier:
      type: object
      properties:
        payId:
          type: string
          description: |
            Australian PayID. Only e-mail PayIDs are supported
          example: john.smith@example.com
